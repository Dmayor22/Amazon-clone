<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/product.css" />
  </head>
  <body>
    <header>
      <div class="banner">
        <a href="../index.html"
          ><img src="../images/amazon_logo.png" alt="" class="logo"
        /></a>
        <div class="delivery">
          <img src="../images/location_icon.png" alt="" />
          <p>Deliver to <br /><span id="uk">United Kingdom</span></p>
        </div>
      </div>

      <!-- search -->
      <div class="search">
        <div class="search_product">
          <p>All</p>
          <img src="../images/dropdown_icon.png" alt="" />
        </div>

        <input type="search" placeholder="Search Amazon" />
        <img src="../images/search_icon.png" alt="" />
      </div>

      <!-- others cta -->
      <div class="other_cta">
        <div class="lang_select">
          <img src="../images/us_flag.png" alt="" />
          <select>
            <option value="en">EN</option>
          </select>
        </div>

        <div class="account">
          <a href="#">Hello, sign in</a>
          <select>
            <option value="acc">Account & Lists</option>
          </select>
        </div>

        <div class="orders">
          <span id="returns">Returns</span>
          <span id="_orders">& Orders</span>
        </div>

        <a href="#" class="cart">
          <img src="../images/cart_icon.png" alt="" />
          <span>Cart</span>
        </a>
      </div>
    </header>

    <main>
      <!-- trade -->
      <section class="trade">
        <div class="menu">
          <img src="../images/menu_icon.png" alt="" />
          <a href="#">All</a>
        </div>

        <!-- menu-navs -->
        <ul>
          <li><a href="">Today's Deals</a></li>
          <li><a href="">Customer Service</a></li>
          <li><a href="">Registry</a></li>
          <li><a href="">Gift Cards</a></li>
          <li><a href="">Sell</a></li>
        </ul>
      </section>
    </main>
  </body>
</html>
