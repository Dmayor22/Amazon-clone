<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="container">
      <a href="../index.html"
        ><img src="../images/amazon_logo_dark.png" alt=""
      /></a>

      <!-- FORM -->
      <form id="signUpForm">
        <h2>Sign Up</h2>

        <div class="input_wrapper">
          <label for="name">Your name</label>
          <input type="text" id="name" placeholder="first and last name" />
        </div>

        <div class="input_wrapper">
          <label for="email">Mobile number or email</label>
          <input type="email" id="email" name="email" />
        </div>

        <div class="input_wrapper">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="At least 6 characters"
          />
        </div>

        <button class="formSubmit" type="submit">Continue</button>

        <p>
          By continuing, you agree to Amazon's
          <a href="#">Condition of use</a> and <a href="#">Privacy notice</a>
        </p>

        <ul>
          <li><a href="#">Need help</a></li>
        </ul>

        <hr />

        <p id="buyforwork">Buying for work?</p>
        <a href="#">Shop on Amazon Business</a>
      </form>

      <p id="new">Have a account</p>

      <button type="button" id="loginAccount">Login with Amazon account</button>
    </div>

    <footer>
      <div class="quicklinks">
        <a href="#">Condition of Use</a>
        <a href="#">Privacy Notice</a>
        <a href="#">Help</a>
      </div>

      <p>&copy; 1996-2026, Amazon.com, Inc. or its affilaites</p>
    </footer>

    <script src="../js/signup.js" defer></script>
  </body>
</html>
