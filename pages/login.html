<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="container">
      <a href="../index.html"
        ><img src="../images/amazon_logo_dark.png" alt=""
      /></a>
      <form>
        <h2>Sign in</h2>
        <label for="email">Email or phone number</label>
        <input type="text" id="email" />
        <button class="formSubmit" type="submit">Continue</button>

        <p>
          By continuing, you agree to Amazon's
          <a href="#">Condition of use</a> and <a href="#">Privacy notice</a>
        </p>

        <ul>
          <li><a href="#">Need help</a></li>
        </ul>

        <hr />

        <p id="buyforwork">Buying for work?</p>
        <a href="#">Shop on Amazon Business</a>
      </form>

      <p id="new">New to Amazon?</p>

      <button type="submit" id="createAccount">
        Create your Amazon account
      </button>
    </div>

    <footer>
      <div class="quicklinks">
        <a href="#">Condition of Use</a>
        <a href="#">Privacy Notice</a>
        <a href="#">Help</a>
      </div>

      <p>&copy; 1996-2026, Amazon.com, Inc. or its affilaites</p>
    </footer>
  </body>
</html>
