<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header>
      <img src="./images/amazon_logo.png" alt="" id="logo" />

      <div class="delivery">
        <img src="./images/location_icon.png" alt="" />
        <p>Deliver to <br><span id="uk">United Kingdom</span></p>
      </div>

      <!-- search -->
      <div class="search">
        <select>
          <option value="all">All</option>
        </select>

        <input type="search" placeholder="Search Amazon" />

        <div class="search_image">
          <img src="./images/search_icon.png" alt="" />
        </div>
      </div>

      <!-- others cta -->
      <div class="other_cta">
        <div class="lang_select">
          <img src="./images/us_flag.png" alt="" />
          <select>
            <option value="en">EN</option>
          </select>
        </div>

        <div class="account">
          <a href="#">Hello, sign in</a>
          <select>
            <option value="acc">Account & Lists</option>
          </select>
        </div>

        <p>Returns & Orders</p>

        <div class="cart">
          <img src="./images/cart_icon.png" alt="" />
          <span>Cart</span>
        </div>
      </div>
    </header>

    <script src="./js/app.js"></script>
  </body>
</html>
